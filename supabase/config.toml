project_id = "nha-minh"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Bắt email xác minh và đặt lại mật khẩu ở local, không gửi thật.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "family://"
additional_redirect_urls = [
  "family://join",
  "family://reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Xưng hô và tên hiển thị lấy từ profiles, không lấy từ provider.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# BẬT xác minh email, NHƯNG client vẫn cho vào app khi chưa xác minh —
# chặn ngay lúc đăng ký là thêm một chỗ bỏ cuộc trước khi thấy giá trị (G3).
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
# Tối thiểu 8 ký tự, khớp zod schema signInInput ở apps/mobile.
[auth.email.smtp]
# Dev dùng inbucket. Trước khi phát hành phải cắm SMTP thật (Resend/Postmark) —
# SMTP mặc định của Supabase giới hạn rất thấp và dễ vào spam.

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"

[functions]
# Edge Functions nạp packages/domain thẳng từ source qua import map,
# không qua bước build (01 §1).
verify_jwt = true

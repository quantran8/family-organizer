# Dự án chạy trên SUPABASE CLOUD. KHÔNG có Docker, KHÔNG có stack local.
#
# File này vẫn cần: `supabase link`, `db push`, và `functions deploy` đều đọc
# nó. Các cổng bên dưới KHÔNG có tác dụng gì — chúng chỉ dùng cho `supabase
# start`, thứ không chạy được ở đây. Giữ lại vì CLI đòi các khoá này tồn tại.
#
# Mọi lệnh cần Docker đều KHÔNG dùng được, đã bỏ khỏi package.json:
#   - `supabase db reset`  → migration mới đẩy thẳng lên cloud bằng `db push`,
#     và một migration sai trên cloud là dữ liệu thật.
#   - `supabase db diff`   → cần shadow database (một container Postgres). Muốn
#     biết schema cloud lệch gì so với migrations thì dùng `db pull` rồi đọc
#     diff bằng git.
#   - `supabase functions serve` → cần Docker để chạy Deno runtime. Sửa Edge
#     Function thì deploy lên cloud (`pnpm fn:deploy`) rồi xem log ở
#     Dashboard → Edge Functions → Logs. Không có đường chạy local.
#
# `supabase/tests/smoke.sql` chạy qua `psql` vào cloud. Nó TẠO dữ liệu test
# (hai user a@test.vn / b@test.vn, một nhà, một khoản nợ) — chỉ chạy trên
# project trống hoặc project staging riêng, đừng chạy trên project đang có dữ
# liệu thật của bạn, vì không có `db reset` để dọn.
#
# `project_id` là tên tham chiếu cục bộ, KHÔNG phải project ref trên cloud.
# Project ref thật (chuỗi 20 ký tự) nằm ở `.temp/project-ref` sau khi `link`.
project_id = "nha-minh"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Phải KHỚP major version của project cloud, nếu không `db push` sẽ so sai
# schema. Supabase project tạo mới hiện dùng Postgres 17 — sửa số này cho khớp
# thứ Dashboard → Settings → Infrastructure hiển thị.
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "family://"
additional_redirect_urls = [
  "family://join",
  "family://reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Khớp zod schema signInInput ở apps/mobile: "Mật khẩu cần ít nhất 8 ký tự."
minimum_password_length = 8
# Xưng hô và tên hiển thị lấy từ profiles, không lấy từ provider.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Để FALSE trong lúc phát triển, kể cả trên cloud: bật xác minh thì mỗi tài
# khoản test phải vào hộp thư bấm link trước khi đăng nhập được, mà SMTP mặc
# định của Supabase giới hạn ~2 email/giờ — đủ để chặn đứng một buổi thử app.
#
# BẬT trước khi phát hành, CÙNG LÚC với việc cắm SMTP thật. Nhưng client vẫn
# cho vào app khi chưa xác minh (`auth.emailNotVerified` ở i18n là một dòng
# nhắc, không phải một bức tường): chặn ngay lúc đăng ký là thêm một chỗ bỏ
# cuộc trước khi người dùng kịp thấy giá trị.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false

# Trước khi phát hành phải cắm SMTP thật (Resend/Postmark) ở Dashboard →
# Authentication → Emails → SMTP Settings. SMTP mặc định của Supabase giới hạn
# rất thấp và dễ vào spam.

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"

# Edge Functions nạp packages/domain thẳng từ source qua import_map.json,
# không qua bước build (01 §1).
#
# `[functions]` KHÔNG nhận khoá chung — mỗi function một section riêng
# `[functions.<tên>]`. Khai báo khi thêm function ở G6/G8/G9; mặc định
# verify_jwt = true nên các function gọi từ app không cần khai gì thêm.
#
# Ngoại lệ sẽ cần: revenuecat-webhook phải verify_jwt = false (RevenueCat gọi
# tới, không mang JWT của người dùng) và tự kiểm chữ ký của chính nó.

# Hai function của G4 là CRON, không phải người dùng gọi: chúng chạy cho mọi
# nhà bằng service role, không thay mặt ai. `verify_jwt = false` vì scheduler
# không mang JWT của người dùng — bảo vệ nằm ở chỗ chỉ scheduler và service key
# gọi tới được, không nằm ở JWT.
[functions.generate-task-instances]
verify_jwt = false

[functions.build-reminders]
verify_jwt = false

# `refresh-lunar-dates` có HAI người gọi: app (ngay sau khi lưu một sự kiện, để
# ngày dương có mặt trong vài giây) và cron đêm (quét lại mọi sự kiện, vì ngày
# dương của một ngày âm đổi mỗi năm).
#
# `verify_jwt = false` vì cron không mang JWT. App gọi qua `functions.invoke`
# thì vẫn kèm JWT, nhưng function không dùng tới: nó chạy service role và tự
# quyết định phạm vi bằng `eventId` trong body.
#
# Hệ quả bảo mật đã cân nhắc: ai biết URL đều gọi được. Thứ họ làm được nhiều
# nhất là bắt tính lại ngày âm — một phép tính thuần, không đọc ra dữ liệu nào
# và không ghi gì ngoài chính cột cache. Đổi lại là cron chạy được mà không phải
# nhúng service key vào một chỗ thứ hai.
[functions.refresh-lunar-dates]
verify_jwt = false

project_id = "nha-minh"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Bắt email xác minh và đặt lại mật khẩu ở local, không gửi thật.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "family://"
additional_redirect_urls = [
  "family://join",
  "family://reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Khớp zod schema signInInput ở apps/mobile: "Mật khẩu cần ít nhất 8 ký tự."
minimum_password_length = 8
# Xưng hô và tên hiển thị lấy từ profiles, không lấy từ provider.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Ở LOCAL để false: bật xác minh thì mọi tài khoản test phải vào hộp thư
# (127.0.0.1:54324) bấm link trước khi đăng nhập được — chậm mà không kiểm
# thêm được gì. Trên prod thì BẬT, nhưng client vẫn cho vào app khi chưa xác
# minh: chặn ngay lúc đăng ký là thêm một chỗ bỏ cuộc trước khi thấy giá trị.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false

# Trước khi phát hành phải cắm SMTP thật (Resend/Postmark) — SMTP mặc định của
# Supabase giới hạn rất thấp và dễ vào spam. Local dùng local_smtp ở trên.

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"

# Edge Functions nạp packages/domain thẳng từ source qua import_map.json,
# không qua bước build (01 §1).
#
# `[functions]` KHÔNG nhận khoá chung — mỗi function một section riêng
# `[functions.<tên>]`. Khai báo khi thêm function ở G6/G8/G9; mặc định
# verify_jwt = true nên các function gọi từ app không cần khai gì thêm.
#
# Ngoại lệ sẽ cần: revenuecat-webhook phải verify_jwt = false (RevenueCat gọi
# tới, không mang JWT của người dùng) và tự kiểm chữ ký của chính nó.
